[project]
name = "interview-helper-backend"
version = "0.1.0"
description = "AI Mock Interview P0 Backend (FastAPI + LangGraph + SQLite WAL)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiosqlite>=0.20.0",
    "edge-tts>=7.3.1",
    "fastapi>=0.115.0",
    "httpx>=0.27.2",
    "langgraph>=0.2.50",
    "markitdown[pdf]>=0.1.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.12",
    "sqlalchemy[asyncio]>=2.0.35",
    "tiktoken>=0.8.0",
    "uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["../tests"]
